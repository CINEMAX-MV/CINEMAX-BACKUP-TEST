<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINEMAX Movies</title>
<meta name="google-site-verification" content="NsP_G5rJExVuv5Pi2jIGwtdl5kvH3oVpXvHKFradjJ4" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
/* Global Styles */
body {
  font-family: 'Poppins', sans-serif;
  background: #0f0f0f;
  color: #fff;
  margin: 0;
  scroll-behavior: smooth;
}
a { text-decoration: none; }

/* Topbar Header */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  background: #111;
  position: sticky;
  top: 0;
  z-index: 999;
  box-shadow: 0 2px 6px rgba(0,0,0,0.5);
}
.topbar .logo {
  font-size: 24px;
  font-weight: 700;
  color: #e50914;
  letter-spacing: 2px;
}
.topbar nav {
  display: flex;
  align-items: center;
  gap: 20px;
}
.topbar nav a {
  color: #fff;
  font-weight: 500;
  font-size: 14px;
  transition: 0.3s;
}
.topbar nav a:hover { color: #e50914; }
.topbar nav p { margin: 0; font-size: 14px; color: #ccc; }

/* Container */
.container {
  padding: 20px;
  max-width: 1200px;
  margin: auto;
}

/* Search Box */
.search-box {
  max-width: 400px;
  margin: 20px auto;
}
.search-box input {
  width: 100%;
  padding: 12px 20px;
  border-radius: 25px;
  border: none;
  outline: none;
  font-size: 14px;
  background: #1c1c1c;
  color: #fff;
}

/* Movies Grid */
.movies {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

/* Movie Card */
.movie {
  background: #1c1c1c;
  border-radius: 12px;
  overflow: hidden;
  text-align: center;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  position: relative;
}
.movie:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(229,9,20,0.5);
}
.movie img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  display: block;
  transition: transform 0.3s;
}
.movie:hover img {
  transform: scale(1.1);
}
.movie-info {
  padding: 12px;
}
.movie h3 {
  font-size: 16px;
  margin: 10px 0 5px;
}
.movie p {
  font-size: 14px;
  color: #ccc;
  margin: 5px 0;
}

/* Pagination */
#pagination {
  text-align: center;
  margin: 30px 0;
}
#pagination button {
  background: #e50914;
  color: #fff;
  border: none;
  padding: 8px 16px;
  margin: 0 5px;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
  transition: 0.3s;
}
#pagination button:hover { background: #ff1f2d; }
#pagination button:disabled { background: #555; cursor: not-allowed; }
#pageInfo { font-size: 14px; color: #ccc; }

/* WhatsApp Floating Button */
.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: #fff;
  padding: 12px 18px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: 0.3s;
  z-index: 1000;
}
.whatsapp:hover { background: #1ebe57; }

/* Footer */
footer {
  background: #111;
  text-align: center;
  padding: 20px;
  margin-top: 30px;
  font-size: 14px;
  color: #aaa;
}

/* Responsive */
@media(max-width:768px) {
  .movie img { height: 220px; }
}
@media(max-width:480px) {
  .movie img { height: 180px; }
}

/* Optional: Hide info if needed */
/* .movie p, .movie a { display: none; } */
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">CINEMAX</div>
  <nav>
    <p>💃Views: <span id="viewCount">Loading...</span></p>
    <a href="moviebox.html">Moviebox</a>
    <a href="films.html">Latest</a>
    <a href="home.html">Home</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="container">
  <h2>Latest Movies</h2>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search movies...">
  </div>

  <div class="movies">
    <!-- Movie Card -->  
    <div class="movie" onclick="openMovie()">
      <img src="https://i.ibb.co/nq4BkY7Q/RD393437343037303731353740732e77686174736170702e6e6574-633887.jpg" alt="Epic">
      <div class="movie-info">
        <p>Action | සිංහල</p>
        <h3>Epic (2013)</h3>
      </div>
    </div>
    
    <!-- More Movie Cards can be copied here -->
  </div>

  <!-- Pagination Example -->
  <div id="pagination">
    <button id="prevBtn" disabled>Prev</button>
    <span id="pageInfo">Page 1 of 5</span>
    <button id="nextBtn">Next</button>
  </div>
</div>

<!-- WhatsApp Floating Button -->
<a href="https://wa.me/94740421520" target="_blank" class="whatsapp">WhatsApp</a>

<footer>
  © 2026 CINEMAX. All rights reserved.
</footer>

<script>
function openMovie() {
  window.location.href = "movies.html";
}

// Optional: Simple pagination logic example
let currentPage = 1;
const totalPages = 5;
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageInfo = document.getElementById('pageInfo');

prevBtn.onclick = () => { if(currentPage>1){ currentPage--; updatePage(); } };
nextBtn.onclick = () => { if(currentPage<totalPages){ currentPage++; updatePage(); } };

function updatePage() {
  pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
  prevBtn.disabled = currentPage===1;
  nextBtn.disabled = currentPage===totalPages;
}
</script>

</body>
</html>
