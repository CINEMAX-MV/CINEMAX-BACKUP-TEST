<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parasakthi (2026)</title>
<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial}
.hero img{width:100%;max-height:420px;object-fit:cover}
.section{padding:20px}
.info{display:flex;gap:16px;margin-top:-80px}
.info img{width:150px;border-radius:10px}
.meta h2{margin:0 0 8px 0}
.badge{display:inline-block;background:#222;padding:4px 10px;border-radius:20px;margin:4px 6px 4px 0;font-size:12px}
.desc{margin-top:12px;line-height:1.6;color:#ccc}
.buttons{margin-top:24px}
.btn{display:inline-block;padding:12px 20px;margin-right:12px;border-radius:30px;text-decoration:none;color:#fff;font-weight:bold}
.watch{background:#e50914}
.download{background:#444}
</style>
</head>
<body><div class="hero">
  <img src="parasakthi-banner.jpg" alt="Parasakthi">
</div><div class="section">
  <div class="info">
    <img src="parasakthi-poster.jpg" alt="Poster">
    <div class="meta">
      <h2>Parasakthi (2026) Sinhala Subtitles</h2>
      <span class="badge">Tamil</span>
      <span class="badge">India</span>
      <span class="badge">163 min</span>
      <div class="desc">
        Country වලට පස්සෙ description එක මෙතන දාන්න පුළුවන්. ඔයාට කැමති විස්තර මෙතන freely edit කරන්න.
      </div>
    </div>
  </div>  <div class="buttons">
  <div class="server-box">
    <h3>🎬 Select Server</h3>
    <button onclick="openPlayer('player1')">▶ Player 01 (No Ads)</button>
    <button onclick="openPlayer('player2')">▶ Player 02 (Google Drive)</button>
  </div>
</div><!-- Players --><div id="player1" class="player">
  <iframe src="https://example.com/embed-player" allowfullscreen></iframe>
</div><div id="player2" class="player">
  <iframe src="https://drive.google.com/file/d/1jlY0iArdFPbyGA2bQJGwAGskjePyn7Q0/preview" allowfullscreen></iframe>
</div><script>
function openPlayer(id){
  document.querySelectorAll('.player').forEach(p=>p.style.display='none');
  document.getElementById(id).style.display='block';
  document.getElementById(id).scrollIntoView({behavior:'smooth'});
}
</script><style>
.server-box{margin-top:30px}
.server-box h3{margin-bottom:10px}
.server-box button{display:block;width:100%;max-width:320px;margin-bottom:10px;padding:12px;border:none;border-radius:30px;background:#222;color:#fff;font-size:15px;cursor:pointer}
.server-box button:hover{background:#e50914}
.player{display:none;margin-top:20px}
.player iframe{width:100%;height:420px;border:none;border-radius:12px}
</style></div></body>
</html>
