

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinemax Movies</title>
  <style>
    body{
      margin:0;
      background:#0f0f0f;
      font-family:Arial, Helvetica, sans-serif;
      color:#fff;
    }header{
  padding:15px 20px;
  font-size:22px;
  font-weight:bold;
  background:#000;
  border-bottom:1px solid #222;
}

.movies{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:18px;
  padding:20px;
}

.movie{
  background:#111;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .2s;
}

.movie:hover{
  transform:scale(1.04);
}

.movie img{
  width:100%;
  display:block;
}

.movie-info{
  padding:10px;
  text-align:center;
}

.movie-info p{
  margin:0;
  font-size:12px;
  color:#aaa;
}

.movie-info h3{
  margin:6px 0 0 0;
  font-size:14px;
  font-weight:bold;
}

  </style>
</head>
<body>
  
  <header>🎬 CINEMAX</header>
  <div class="movies">  
    
    <!-- Movie Card -->  
    <div class="movie" onclick="openMovie()">
    <img src="https://i.ibb.co/nq4BkY7Q/RD393437343037303731353740732e77686174736170702e6e6574-633887.jpg" alt="Epic">
    <div class="movie-info">
      <p>Action | සිංහල</p>
      <h3>Epic (2013)</h3>
    </div>
  </div></div><script>
  function openMovie(){
    window.location.href = "movies.html";
  }
</script>
</body>
</html>
