

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINEMAX Movies</title>
<meta name="google-site-verification" content="NsP_G5rJExVuv5Pi2jIGwtdl5kvH3oVpXvHKFradjJ4" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Poppins', sans-serif;
  background: #0f0f0f;
  color: #fff;
  margin: 0;
}
header {
  background: url("https://i.ibb.co/Cs7SbdVt/RD393437343037303731353740732e77686174736170702e6e6574-634148.jpg");
  background-size: cover;
  background-position: center;
  padding: 40px 0;
  text-align: center;
  font-size: 28px;
  font-weight: 700;
}
header p { font-size: 14px; color: #eee; margin-top: 5px; font-weight: 300; }

nav { display: flex; justify-content: center; gap: 25px; background: #111; padding: 12px 0; }
nav a { color: #fff; text-decoration: none; font-weight: 500; transition: 0.2s; }
nav a:hover { color: #e50914; }

.container { padding: 20px; }
.search-box { max-width: 400px; margin: 20px auto; }
.search-box input { width: 100%; padding: 12px 15px; border-radius: 25px; border: none; outline: none; font-size: 14px; }

.movies { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }

.movie {
  background: #1c1c1c;
  border-radius: 12px;
  overflow: hidden;
  text-align: center;
  transition: transform 0.3s, box-shadow 0.3s;
}
.movie:hover { transform: scale(1.03); box-shadow: 0 8px 20px rgba(229,9,20,0.5); }

.movie img { width: 100%; height: auto; object-fit: cover; display: block; }

.movie h3 { font-size: 16px; margin: 10px 0 5px; }
.movie p { font-size: 14px; color: #ccc; margin: 5px 0; }

.movie a {
  display: inline-block;
  margin: 8px 0 12px;
  padding: 6px 12px;
  background: #e50914;
  color: #fff;
  text-decoration: none;
  border-radius: 20px;
  font-size: 13px;
  transition: 0.3s;
}
.movie a:hover { background: #ff1f2d; }

#pagination { text-align: center; margin: 30px 0; }
#pagination button {
  background: #e50914; color: #fff; border: none; padding: 8px 16px;
  margin: 0 5px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.3s;
}
#pagination button:hover { background: #ff1f2d; }
#pagination button:disabled { background: #555; cursor: not-allowed; }
#pageInfo { font-size: 14px; color: #ccc; }

.whatsapp {
  position: fixed; bottom: 20px; right: 20px; background: #25D366; color: #fff;
  padding: 12px 18px; border-radius: 50px; text-decoration: none; font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s;
}
.whatsapp:hover { background: #1ebe57; }

footer {
  background: #111; text-align: center; padding: 20px; margin-top: 30px;
  font-size: 14px; color: #aaa;
}

  .topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  background: #000;
  position: sticky;
  top: 0;
  z-index: 999;
}

.topbar .logo {
  font-size: 22px;
  font-weight: 700;
  color: #e50914;
  letter-spacing: 2px;
}

.topbar nav {
  background: transparent;
  padding: 0;
}

.topbar nav a {
  margin-left: 18px;
  font-size: 14px;
}

  .movie p,
.movie a {
  display: none;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">CINEMAX</div>
  <nav>
    <p>💃Views: <span id="viewCount">Loading...</span></p>
    <a href="moviebox.html">Moviebox</a>
    <a href="films.html">Latest</a>
    <a href="home.html">Home</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="container">
  <h2>Latest Movies</h2>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search movies...">
  </div>

  <div class="movies">
    
    <!-- Movie Card -->  
    <div class="movie" onclick="openMovie()">
    <img src="https://i.ibb.co/nq4BkY7Q/RD393437343037303731353740732e77686174736170702e6e6574-633887.jpg" alt="Epic">
    <div class="movie-info">
      <p>Action | සිංහල</p>
      <h3>Epic (2013)</h3>
    </div>
  </div></div><script>
  function openMovie(){
    window.location.href = "movies.html";
  }
</script>
</body>
</html>
