<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peksha Movies</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;display:flex}
.sidebar{
width:220px;
background:#151515;
height:100vh;
padding:20px;
position:fixed;
}
.sidebar h2{color:#ff3d00;margin-bottom:30px}
.sidebar a{
display:block;
color:#aaa;
text-decoration:none;
margin:15px 0;
transition:0.3s;
}
.sidebar a:hover{color:#ff3d00}

.main{
margin-left:220px;
width:100%;
padding:20px;
}
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}
.search{
padding:8px 12px;
border:none;
border-radius:20px;
outline:none;
width:250px;
}
.movies{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
}
.card{
background:#1c1c1c;
border-radius:10px;
overflow:hidden;
transition:0.3s;
cursor:pointer;
}
.card img{
width:100%;
height:250px;
object-fit:cover;
}
.card:hover{
transform:scale(1.05);
}
.card h3{
padding:10px;
font-size:15px;
}

@media(max-width:768px){
.sidebar{display:none}
.main{margin-left:0}
}
</style>
</head>
<body>

<div class="sidebar">
<h2>🎬 Peksha Movies</h2>
<a href="#">Dashboard</a>
<a href="#">Latest</a>
<a href="#">Action</a>
<a href="#">Comedy</a>
<a href="#">Sinhala</a>
<a href="#">Hollywood</a>
</div>

<div class="main">
<div class="topbar">
<h1>Dashboard</h1>
<input type="text" class="search" placeholder="Search movie...">
</div>

<div class="movies">

<div class="card">
<img src="https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg">
<h3>Avatar: The Way of Water</h3>
</div>

<div class="card">
<img src="https://image.tmdb.org/t/p/w500/qNBAXBIQlnOThrVvA6mA2B5ggV6.jpg">
<h3>Spider-Man: No Way Home</h3>
</div>

<div class="card">
<img src="https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg">
<h3>Avengers: Endgame</h3>
</div>

<div class="card">
<img src="https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg">
<h3>Venom</h3>
</div>

</div>
</div>

</body>
</html>
