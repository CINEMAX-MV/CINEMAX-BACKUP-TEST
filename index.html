<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINEMAX Movies</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
/* Global Styles */
body {
  font-family: 'Poppins', sans-serif;
  background: #0f0f0f;
  color: #fff;
  margin: 0;
}
a { text-decoration: none; color: inherit; }

/* Header / Topbar */
header.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  background: #000;
  position: sticky;
  top: 0;
  z-index: 999;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
header.topbar .logo {
  font-size: 28px;
  font-weight: 800;
  color: #e50914;
  letter-spacing: 3px;
  text-shadow: 1px 1px 5px rgba(255,0,20,0.7);
}
header.topbar nav {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}
header.topbar nav a {
  font-size: 14px;
  padding: 6px 10px;
  transition: 0.2s;
  border-radius: 6px;
}
header.topbar nav a:hover { background: #e50914; color: #fff; }

/* Container */
.container {
  padding: 20px;
  max-width: 1200px;
  margin: auto;
}
.container h2 {
  margin-bottom: 20px;
  font-size: 26px;
  text-align: center;
  color: #e50914;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
}

/* Search Box */
.search-box {
  max-width: 400px;
  margin: 0 auto 30px auto;
}
.search-box input {
  width: 100%;
  padding: 12px 20px;
  border-radius: 25px;
  border: none;
  outline: none;
  font-size: 14px;
  background: #1c1c1c;
  color: #fff;
  box-shadow: inset 0 0 6px rgba(255,255,255,0.1);
}

/* Movies Grid */
.movies {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 25px;
}

/* Movie Card */
.movie {
  background: #1c1c1c;
  border-radius: 12px;
  overflow: hidden;
  text-align: center;
  transition: transform 0.3s, box-shadow 0.3s;
  cursor: pointer;
}
.movie:hover {
  transform: scale(1.03);
  box-shadow: 0 12px 25px rgba(229,9,20,0.5);
}
.movie img {
  width: 100%;
  height: auto;
  display: block;
  aspect-ratio: 2/3;
  object-fit: cover;
  transition: transform 0.3s;
}
.movie:hover img {
  transform: scale(1.05);
}
.movie-info {
  padding: 12px 10px 16px 10px;
}
.movie-info h3 {
  font-size: 16px;
  margin: 8px 0 4px;
  color: #fff;
}
.movie-info p {
  font-size: 14px;
  color: #ccc;
  margin: 0 0 10px 0;
}

/* Watch / Download Button */
.movie .watch-btn {
  display: inline-block;
  width: 90%;
  margin: 0 auto 12px auto;
  padding: 8px 0;
  background: #e50914;
  color: #fff;
  border-radius: 25px;
  font-size: 14px;
  font-weight: 600;
  transition: 0.3s;
}
.movie .watch-btn:hover { background: #ff1f2d; }

/* Footer */
footer {
  background: #111;
  text-align: center;
  padding: 20px;
  margin-top: 30px;
  font-size: 14px;
  color: #aaa;
}

/* Responsive Fixes */
@media (max-width: 768px) {
  header.topbar {
    flex-direction: column;
    align-items: flex-start;
  }
  header.topbar nav {
    gap: 12px;
  }
  .container h2 { font-size: 22px; }
}
@media (max-width: 480px) {
  .search-box { width: 90%; }
  .movie-info h3 { font-size: 14px; }
  .movie-info p { font-size: 12px; }
  .movie .watch-btn { font-size: 13px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">CINEMAX</div>
  <nav>
    <a href="moviebox.html">Moviebox</a>
    <a href="films.html">Latest</a>
    <a href="home.html">Home</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="container">
  <h2>Latest Movies</h2>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search movies...">
  </div>

  <div class="movies">
    <!-- Movie Card Example -->
    <div class="movie" onclick="openMovie('movies.html')">
      <img src="https://i.ibb.co/nq4BkY7Q/RD393437343037303731353740732e77686174736170702e6e6574-633887.jpg" alt="Epic">
      <div class="movie-info">
        <p>Action | සිංහල</p>
        <h3>Epic (2013)</h3>
      </div>
      <a href="https://drive.google.com/file/d/1jlY0iArdFPbyGA2bQJGwAGskjePyn7Q0/view?usp=drivesdk" class="watch-btn">▶ Watch / Download</a>
    </div>
    <!-- Add more movie cards similarly -->
  </div>
</div>

<footer>
  &copy; 2026 CINEMAX. All rights reserved.
</footer>

<script>
function openMovie(url){
  window.location.href = url;
}

// Search filter
const searchInput = document.getElementById('searchInput');
const movies = document.querySelectorAll('.movie');

searchInput.addEventListener('input', () => {
  const term = searchInput.value.toLowerCase();
  movies.forEach(movie => {
    const title = movie.querySelector('h3').textContent.toLowerCase();
    movie.style.display = title.includes(term) ? 'block' : 'none';
  });
});
</script>

</body>
</html>
